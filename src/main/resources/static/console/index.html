<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigma Console</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ea; --text: #1c2430;
    --muted: #67707d; --accent: #3b5bdb; --accent-soft: #edf2ff; --chip: #eef1f6;
    --ok: #2f9e44; --warn: #e8890c; --bad: #e03131;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --panel: #1a2029; --border: #2a3240; --text: #e7ecf2;
      --muted: #8b96a5; --accent: #74a0ff; --accent-soft: #1d2740; --chip: #232b37;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
           padding: 20px 28px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 20px; } header h1 span { color: var(--accent); }
  .facts { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  .fact { background: var(--chip); border: 1px solid var(--border); border-radius: 20px;
          padding: 3px 12px; font-size: 12.5px; color: var(--muted); }
  .fact b { color: var(--text); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 26px 28px 60px; }
  .bar { display: flex; align-items: center; gap: 14px; margin: 4px 0 18px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          padding: 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .card .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 3px; }
  .card .name { font-size: 17px; font-weight: 650; }
  .desc { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .pill { font-size: 11px; font-weight: 700; padding: 2.5px 9px; border-radius: 20px;
          background: var(--accent-soft); color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: baseline; margin: 7px 0; flex-wrap: wrap; }
  .row .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); min-width: 118px; }
  .chip { background: var(--chip); border: 1px solid var(--border); border-radius: 6px;
          padding: 2px 9px; font-size: 12.5px; }
  .chip b { color: var(--accent); font-weight: 600; }
  .none { color: var(--muted); font-size: 12.5px; font-style: italic; }
  button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text);
           border-radius: 8px; padding: 7px 16px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.small { padding: 4px 12px; font-size: 13px; }
  /* editor */
  .editor { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
            padding: 26px 30px; max-width: 780px; margin: 0 auto; }
  .editor h3 { font-size: 19px; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  fieldset { border: none; border-top: 1px solid var(--border); padding: 16px 0 6px; margin-top: 16px; }
  legend { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding-right: 12px; }
  label.inline { display: inline-flex; gap: 7px; align-items: center; margin: 5px 18px 5px 0; cursor: pointer; }
  input[type=text], input[type=number], textarea {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; width: 100%; }
  textarea { resize: vertical; min-height: 60px; }
  .fieldrow { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; flex-wrap: wrap; }
  .fieldrow input[type=text] { width: 180px; }
  .conds { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .cond { user-select: none; cursor: pointer; background: var(--chip); border: 1px solid var(--border);
          border-radius: 20px; padding: 3px 12px; font-size: 12.5px; }
  .cond.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .problems { background: #fff4e6; border: 1px solid #ffd8a8; color: #d9480f; border-radius: 10px;
              padding: 12px 18px; margin: 16px 0; }
  @media (prefers-color-scheme: dark) { .problems { background: #33261a; border-color: #5c3d1e; color: #ffc078; } }
  .problems li { margin-left: 18px; }
  .preview { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
             font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; margin: 16px 0; }
  .success { background: #ebfbee; border: 1px solid #b2f2bb; color: #2b8a3e; border-radius: 10px;
             padding: 12px 18px; margin: 0 0 18px; }
  @media (prefers-color-scheme: dark) { .success { background: #16281c; border-color: #2b5535; color: #8ce99a; } }
  .actions-bar { display: flex; gap: 12px; margin-top: 22px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>&Sigma; Sigma <span>Console</span></h1>
  <div class="facts" id="facts"></div>
</header>
<main id="main"></main>
<footer>every published change is recorded in the change history (Git) with who and why</footer>
<script>
const CONDITIONS = ["equals", "one of", "greater than", "at least", "less than", "at most",
                    "matches pattern", "is not", "none of", "has a value"];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let INFO = {}, EDITABLE = false, successBanner = '';

async function boot() {
  INFO = await fetch('/console/api/info').then(r => r.json());
  document.getElementById('facts').innerHTML = [
    ['env', INFO.env], ['service', INFO.service], ['database', INFO.databaseType],
  ].map(([k, v]) => `<span class="fact">${esc(k)}: <b>${esc(v)}</b></span>`).join('');
  EDITABLE = INFO.editable === true;
  showList();
}

async function showList() {
  const main = document.getElementById('main');
  const resources = await fetch('/console/api/resources').then(r => r.json());

  const cards = resources.map((r, i) => `
    <div class="card">
      <div class="top">
        <span class="name">${esc(r.name)}</span>
        ${r.actions.read ? '<span class="pill">read</span>' : ''}
        ${r.actions.add ? '<span class="pill">add</span>' : ''}
        ${r.actions.change ? '<span class="pill">change</span>' : ''}
        ${r.actions.remove ? '<span class="pill">remove</span>' : ''}
        ${EDITABLE ? `<span style="margin-left:auto"><button class="small" onclick="showEditor(${i})">Edit</button></span>` : ''}
      </div>
      <div class="desc">${esc(r.description || 'No description yet.')}</div>
      <div class="row"><span class="k">search by</span>${condChips(r.search)}</div>
      <div class="row"><span class="k">change/remove by</span>${condChips(r.changeBy, 'id (always)')}</div>
      <div class="row"><span class="k">options</span>
        ${r.features.changeFeed ? '<span class="chip">other systems can follow changes</span>' : ''}
        <span class="chip">${r.features.pageSize} records per page</span></div>
    </div>`).join('');

  main.innerHTML = `
    ${successBanner}
    <div class="bar">
      <h2>Resources</h2>
      ${EDITABLE ? '<span style="margin-left:auto"><button class="primary" onclick="showEditor(-1)">+ New resource</button></span>' : ''}
    </div>
    <div class="grid">${cards || '<div class="none">No resources yet - create the first one.</div>'}</div>`;
  successBanner = '';
  window.RESOURCES = resources;
}

function condChips(fields, fallback) {
  const entries = Object.entries(fields || {});
  if (!entries.length) return `<span class="none">${fallback || 'nothing configured'}</span>`;
  return entries.map(([f, cs]) => `<span class="chip"><b>${esc(f)}</b>: ${cs.map(esc).join(', ')}</span>`).join('');
}

function showEditor(index) {
  const r = index >= 0 ? window.RESOURCES[index] : {
    name: '', description: '',
    actions: { read: true, add: false, change: false, remove: false },
    search: {}, changeBy: {}, features: { changeFeed: false, pageSize: 100 },
  };
  const isNew = index < 0;
  document.getElementById('main').innerHTML = `
  <div class="editor">
    <h3>${isNew ? 'New resource' : 'Edit "' + esc(r.name) + '"'}</h3>
    <div class="hint">A resource is a collection of records your API exposes - like "products" or "orders".</div>

    <fieldset><legend>Basics</legend>
      <div class="fieldrow"><input type="text" id="f-name" placeholder="name, e.g. orders" value="${esc(r.name)}" ${isNew ? '' : 'readonly'}></div>
      <div class="fieldrow"><textarea id="f-desc" placeholder="What is this resource for? (shown to your team)">${esc(r.description || '')}</textarea></div>
    </fieldset>

    <fieldset><legend>What can people do?</legend>
      <label class="inline"><input type="checkbox" id="a-read" ${r.actions.read ? 'checked' : ''}> Look up records</label>
      <label class="inline"><input type="checkbox" id="a-add" ${r.actions.add ? 'checked' : ''}> Add new records</label>
      <label class="inline"><input type="checkbox" id="a-change" ${r.actions.change ? 'checked' : ''}> Change records</label>
      <label class="inline"><input type="checkbox" id="a-remove" ${r.actions.remove ? 'checked' : ''}> Remove records</label>
    </fieldset>

    <fieldset><legend>Which fields can people search by?</legend>
      <div id="search-rows"></div>
      <button class="small" onclick="addRow('search-rows')">+ add a search field</button>
    </fieldset>

    <fieldset><legend>How are records targeted when changing or removing?</legend>
      <div class="hint" style="margin-bottom:6px">Records can always be targeted by their id. Add fields to allow more.</div>
      <div id="changeby-rows"></div>
      <button class="small" onclick="addRow('changeby-rows')">+ add a targeting field</button>
    </fieldset>

    <fieldset><legend>Options</legend>
      <label class="inline"><input type="checkbox" id="f-feed" ${r.features.changeFeed ? 'checked' : ''}> Let other systems follow changes to this resource</label>
      <div class="fieldrow" style="align-items:center"><span>Records per page:</span>
        <input type="number" id="f-pagesize" value="${r.features.pageSize}" min="1" max="1000" style="width:110px"></div>
    </fieldset>

    <fieldset><legend>Publish</legend>
      <div class="fieldrow"><textarea id="f-reason" placeholder="Why are you making this change? (required - becomes part of the change history)"></textarea></div>
      <div class="fieldrow"><input type="text" id="f-author" placeholder="Your name"></div>
    </fieldset>

    <div id="feedback"></div>
    <div class="actions-bar">
      <button onclick="showList()">Cancel</button>
      <button onclick="checkResource()">Check &amp; preview</button>
      <button class="primary" onclick="publishResource()">Publish</button>
    </div>
  </div>`;
  Object.entries(r.search || {}).forEach(([f, cs]) => addRow('search-rows', f, cs));
  Object.entries(r.changeBy || {}).forEach(([f, cs]) => addRow('changeby-rows', f, cs));
}

function addRow(containerId, field = '', selected = []) {
  const row = document.createElement('div');
  row.className = 'fieldrow';
  row.innerHTML = `
    <input type="text" placeholder="field name" value="${esc(field)}">
    <span class="conds">${CONDITIONS.map(c =>
      `<span class="cond ${selected.includes(c) ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</span>`).join('')}</span>
    <button class="small" title="remove field">&times;</button>`;
  row.querySelectorAll('.cond').forEach(el => el.onclick = () => el.classList.toggle('on'));
  row.querySelector('button').onclick = () => row.remove();
  document.getElementById(containerId).appendChild(row);
}

function collectRows(containerId) {
  const fields = {};
  document.querySelectorAll(`#${containerId} .fieldrow`).forEach(row => {
    const name = row.querySelector('input').value.trim();
    const conds = [...row.querySelectorAll('.cond.on')].map(el => el.dataset.c);
    if (name) fields[name] = conds;
  });
  return fields;
}

function collectResource() {
  return {
    name: document.getElementById('f-name').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    actions: {
      read: document.getElementById('a-read').checked,
      add: document.getElementById('a-add').checked,
      change: document.getElementById('a-change').checked,
      remove: document.getElementById('a-remove').checked,
    },
    search: collectRows('search-rows'),
    changeBy: collectRows('changeby-rows'),
    features: {
      changeFeed: document.getElementById('f-feed').checked,
      pageSize: parseInt(document.getElementById('f-pagesize').value, 10) || 100,
    },
  };
}

function renderProblems(problems) {
  return `<div class="problems"><b>Please fix before publishing:</b><ul>${
    problems.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`;
}

async function checkResource() {
  const result = await fetch('/console/api/resources/validate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(collectResource()),
  }).then(r => r.json());
  document.getElementById('feedback').innerHTML = result.valid
    ? `<div class="success">Looks good${result.isNew ? ' - this will create a new resource' : ''}. This is what will be recorded:</div>
       <div class="preview">${esc(result.preview)}</div>`
    : renderProblems(result.problems);
}

async function publishResource() {
  const body = {
    resource: collectResource(),
    reason: document.getElementById('f-reason').value.trim(),
    author: document.getElementById('f-author').value.trim(),
  };
  const response = await fetch('/console/api/resources', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const result = await response.json();
  if (result.published) {
    successBanner = `<div class="success"><b>${esc(body.resource.name)}</b> is live. The change was recorded as ${esc(result.commit.substring(0, 9))}.</div>`;
    showList();
  } else {
    document.getElementById('feedback').innerHTML = renderProblems(result.problems);
  }
}

boot();
</script>
</body>
</html>
