# Local development mode: fully self-contained run
# - H2 in-memory database (no PostgreSQL)
# - Endpoint configuration from local-config.json (no ZooKeeper)
#
# Run with:
#   ENV=dev SERVICE=sigma mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# ENV/SERVICE must match the paths in the config file (default file uses /dev/sigma).

# Database
sigma.database.type=h2
spring.datasource.url=jdbc:h2:mem:sigma-local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console for debugging (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema created by DatabaseInitializer using the H2 dialect
spring.sql.init.mode=never

# Configuration source: JSON file instead of ZooKeeper
zookeeper.enabled=false
sigma.local-config.enabled=true
sigma.local-config.file=classpath:local-config.json

# Sigma Console (read-only config explorer at /console/index.html)
sigma.console.enabled=true
